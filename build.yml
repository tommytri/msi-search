name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: Win32
            arch: x86
          - platform: x64
            arch: x64

    steps:
      - uses: actions/checkout@v3

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Build ${{ matrix.arch }} Release
        run: msbuild msi_search.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: msi_search-${{ matrix.arch }}
          path: bin/${{ matrix.platform }}/Release/msi_search.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Rename executables
        run: |
          mv msi_search-x86/msi_search.exe msi_search_x86.exe
          mv msi_search-x64/msi_search.exe msi_search_x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            msi_search_x86.exe
            msi_search_x64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
